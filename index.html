<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ahmed Khalil | Portfolio</title>
  <meta name="description" content="Portfolio of Ahmed Khalil, student at the American University in Cairo. Press a TV to see a project.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site">
    <h1>Ahmed Khalil</h1>
  </header>

  <main class="stage">
    <div class="wall" id="wall" aria-label="Three TVs, each showing a project: HELCO, Tessera and The Dental Hauz. Press a TV, or its label below, to open the project."></div>
  </main>
  <nav class="open-row" aria-label="Projects">
    <button data-open="helco" type="button"><span class="label-name">HELCO</span><span class="label-kind">Audit &amp; tax firm · Next.js</span></button>
    <button data-open="tessera" type="button"><span class="label-name">Tessera</span><span class="label-kind">Linen store · Shopify</span></button>
    <button data-open="dental" type="button"><span class="label-name">The Dental Hauz</span><span class="label-kind">Dental clinic · WordPress</span></button>
  </nav>
  <p class="hint"><span class="hint-hover">Hover a TV to bring it forward, press it to open the project.</span><span class="hint-touch">Tap a TV to open the project.</span></p>

  <div class="project" id="project" hidden>
    <div class="frame" id="frame" role="dialog" aria-modal="true" aria-labelledby="p-title">
      <div class="bar">
        <div class="info">
          <h2 id="p-title"></h2>
          <p id="p-desc"></p>
        </div>
        <div class="actions">
          <a id="p-link" href="#" target="_blank" rel="noopener">Open in new tab &#8599;</a>
          <button id="close" type="button">&times; Close</button>
        </div>
      </div>
      <div class="viewport" id="viewport"></div>
    </div>
  </div>

  <footer>
    <a href="mailto:ahmedm.khalil@aucegypt.edu">ahmedm.khalil@aucegypt.edu</a> &middot;
    <a href="https://github.com/ahmedmohamedkhalilx-droid" target="_blank" rel="noopener">GitHub</a>
  </footer>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="script.js"></script>
</body>
</html>
